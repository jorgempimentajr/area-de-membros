/* Zeus Cinematic Members: tokens padrão (valores de reserva). O JS applyBrand() recalcula tudo a partir da cor do cliente. */
:root {
  --ink: #05080F; --ink-rgb: 5,8,15;
  --bg-base: #05080F; --bg-elevated: #0A0F1C; --bg-hover: #0E1420; --bg-active: #131B2A;

  --text-primary: #E8EEF8; --text-secondary: #8DA9CC; --text-tertiary: #5F7FA3;
  --accent: #2A9FE0; --accent-core: #2799CA; --accent-soft: #62C3EC; --accent-rgb: 39,153,202; --accent-text: #FFFFFF;
  --accent-glow: rgba(39,153,202,.34);
  --accent-gradient: linear-gradient(135deg, #1A6BCB 0%, #2799CA 100%);
  --ok: #4ADE80;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px;
  --sec: clamp(48px, 5.6vw, 80px);
  --r-card: 14px; --r-btn: 12px;
  --pad: clamp(20px, 4vw, 56px);
  --topbar-h: 68px;
  --ease: cubic-bezier(.22,1,.36,1);
}

*, *::before, *::after { box-sizing: border-box; }

/* ── Tokens FutMind: dark + azul (mesmas cores da versão anterior) ── */
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--topbar-h) + 16px); }
body {
  margin: 0; background: var(--bg-base); color: var(--text-primary);
  font-family: 'Inter', system-ui, sans-serif; font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  transition: background 300ms ease, color 300ms ease;
}
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── TOPBAR ── */
.topbar {
  position: sticky; top: 0; z-index: 50; height: var(--topbar-h);
  display: flex; align-items: center; gap: 32px; padding: 0 var(--pad);
  background: color-mix(in srgb, var(--bg-base) 88%, transparent);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-bottom: 1px solid var(--border-subtle);
}
.brand { display: flex; align-items: center; gap: 12px; flex: none; }
.lg-l { display: none !important; }
html[data-theme="light"] .lg-d { display: none !important; }
html[data-theme="light"] .lg-l { display: block !important; }
.brand img { height: 44px; width: auto; object-fit: contain; }
.brand-dot { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-gradient); color: var(--accent-text); font-weight: 800; font-size: 18px; }

}

.search {
  display: flex; align-items: center; gap: 8px; height: 44px; width: 44px;
  padding: 0 13px; border-radius: 12px; border: 1px solid transparent;

.home-btn .ic { transition: transform .38s cubic-bezier(.62,0,.22,1); }

.icon-btn {

  border: 1px solid transparent; background: transparent; color: var(--text-secondary);

}

.avatar {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent-gradient); color: #fff; font-size: 14px; font-weight: 700; border: 0;
  box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 3px var(--border-default);
}

/* ── BOTÕES ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 52px; padding: 0 28px; border-radius: var(--r-btn); border: 1px solid transparent;
  font-size: 16px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap;
  transition: transform .15s var(--ease), filter .15s, background .15s, border-color .15s;
}

/* ── HERO ── */
.hero {

  min-height: clamp(580px, 88vh, 840px);

  min-height: 0; background: #050C14;

.hero.fullbanner::before, .hero.fullbanner::after { display: none; }
.hero.fullbanner img { width: 100%; display: block; }
.hero::before {
  content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 70% at 80% 50%, rgba(46,125,175,0.18) 0%, transparent 65%);
}
.hero::after {
  content: ''; position: absolute; top: -120px; left: -120px; width: 500px; height: 500px;
  border-radius: 50%; border: 1px solid rgba(46,125,175,0.10); pointer-events: none; z-index: 0;
}
.hero-in {
  width: 100%; padding: 72px var(--pad) 60px; max-width: 1440px; margin: 0 auto;
  display: flex; align-items: center; gap: 64px; position: relative; z-index: 1;
}
.hero-copy { flex: 1; }
.hero-photo-wrap {
  flex: 0 0 360px; position: relative; height: 540px; border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(46,125,175,0.25);
}
.hero-photo-wrap::before {
  content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, transparent 70%, rgba(7,30,45,0.5) 100%);
}
.hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.eyebrow { display: none; }
.brand-txt { display: none; }
.hero h1 {
  margin: 0 0 var(--s3); font-size: clamp(30px, 3.2vw, 48px); font-weight: 600;
  line-height: 1.06; letter-spacing: -.03em; text-wrap: balance;
}
.hero h1 strong { display: block; font-weight: 800; }
.hero p { margin: 0 0 var(--s4); max-width: 52ch; font-size: clamp(15px, 1.25vw, 18px); line-height: 1.6; color: rgba(232,238,248,.82); }
.hero-cta { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s3); }
.hero-meta { display: flex; }

/* ── CONTAINER E SEÇÕES ── */
.wrap { max-width: 1600px; margin: 0 auto; padding: 0 var(--pad); }
.sec { padding: var(--sec) 0 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: var(--s3); }
.sec-head h2 { margin: 0; font-size: clamp(20px, 2vw, 26px); font-weight: 700; letter-spacing: -.02em; }
.sec-head small { font-size: 14px; color: var(--text-tertiary); font-weight: 500; }

/* ── BARRA DE PRÓXIMO PASSO (sobe sobre o hero) ── */
.next {
  position: relative; z-index: 2; margin-top: -48px;
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: var(--s3);
  padding: var(--s3); border-radius: 20px;
  background: color-mix(in srgb, var(--bg-elevated) 90%, transparent);
  backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--border-default); box-shadow: 0 24px 60px rgba(0,0,0,.45);
}
.next-thumb { width: 72px; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: var(--bg-active); }
.next-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; display: block; }
.next-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; margin-bottom: 8px; border: 1px solid rgba(var(--accent-rgb), .55); border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.next-title { font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; }
.next-sub { margin-top: 4px; font-size: 14px; color: var(--text-secondary); }
.ring { position: relative; width: 64px; height: 64px; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: var(--bg-active); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.ring-wrap { display: flex; align-items: center; gap: 14px; padding-left: 24px; border-left: 1px solid var(--border-subtle); }
.ring-lbl { font-size: 14px; line-height: 1.35; color: var(--text-secondary); }
.ring-lbl b { display: block; color: var(--text-primary); font-size: 16px; font-weight: 600; }

/* ── POSTERS (módulos) ── */
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--s3); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.poster {
  position: relative; display: flex; flex-direction: column; justify-content: flex-start; align-self: start; width: 100%; padding: 0; text-align: left;
  background: none; border: 0; color: inherit;
}
.poster-art {
  position: relative; aspect-ratio: 3 / 5; border-radius: var(--r-card); overflow: hidden;
  background: var(--bg-active); border: 1px solid var(--border-subtle);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .2s;
}
.poster-art img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; transition: transform .6s var(--ease); }
.poster-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(var(--ink-rgb), .78) 0%, rgba(var(--ink-rgb), 0) 40%); opacity: 0; transition: opacity .3s; }
.poster:hover .poster-art, .poster:focus-visible .poster-art {
  transform: translateY(-6px) scale(1.03); border-color: var(--border-strong);
  box-shadow: 0 28px 56px rgba(0,0,0,.55), 0 0 0 1px var(--border-strong), 0 0 40px var(--accent-glow);

}

.poster-num {
  position: absolute; top: 10px; left: 10px; z-index: 2; min-width: 32px; height: 32px; padding: 0 9px;
  display: grid; place-items: center; border-radius: 10px; font-size: 13px; font-weight: 700; color: #fff;
  background: rgba(var(--ink-rgb), .62); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.18);
}
.poster-new { position: absolute; top: 10px; right: 10px; z-index: 2; height: 24px; padding: 0 10px; display: grid; place-items: center; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--accent-gradient); box-shadow: 0 4px 14px var(--accent-glow); }
.poster-play {
  position: absolute; z-index: 2; left: 50%; bottom: 14px; transform: translate(-50%, 10px);
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px;
  background: #fff; color: var(--ink); font-size: 13px; font-weight: 700; opacity: 0;
  transition: opacity .25s, transform .3s var(--ease); white-space: nowrap;
}
.poster-play .ic { width: 14px; height: 14px; fill: currentColor; stroke: none; }
.poster:hover .poster-play, .poster:focus-visible .poster-play { opacity: 1; transform: translate(-50%, 0); }
.pbar { position: absolute; left: 16px; right: 16px; bottom: 10px; z-index: 3; height: 3px; border-radius: 3px; background: rgba(var(--accent-rgb), .3); overflow: hidden; pointer-events: none; }
.pbar i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); border-radius: 3px; background: var(--accent-soft); box-shadow: 0 0 8px rgba(var(--accent-rgb), .7); transition: width .7s var(--ease); }
.lesson-th .pbar { left: 10px; right: 10px; bottom: 8px; }
.poster-cap { padding: var(--s2) 0 0; min-height: 42px; }
.poster-cap b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.poster-cap .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.poster.hide { display: none; }
.empty { display: none; padding: 56px 0; text-align: center; color: var(--text-tertiary); font-size: 15px; }
.empty.on { display: block; }


/* ── CURSO ATLETA PRONTO (aulas) ── */
.poster-title { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 124px; padding: var(--s4) var(--s2) 28px; display: flex; flex-direction: column; justify-content: flex-start; background: linear-gradient(0deg, rgba(var(--ink-rgb), .94) 0%, rgba(var(--ink-rgb), .78) 55%, rgba(var(--ink-rgb), 0) 100%); font-size: 17px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; color: #fff; }
.poster-title > span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.poster-title small { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-soft); }
.poster.baked .poster-title { display: none; }
.poster-title { transition: opacity .2s; }
.poster:hover .poster-title, .poster:focus-visible .poster-title { opacity: 0; }
.poster.on .poster-art { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 36px var(--accent-glow); }
.panel { margin-top: var(--s3); padding: var(--s3); border-radius: 20px; background: var(--bg-elevated); border: 1px solid var(--border-default); }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s3); }
.panel-head b { font-size: 18px; font-weight: 700; letter-spacing: -.015em; }
.panel-head span { font-size: 14px; color: var(--text-tertiary); white-space: nowrap; }
.panel-head b { min-width: 0; }
.lessons { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s3) var(--s2); }
.lessons > .lesson { flex: 0 1 clamp(240px, 23%, 300px); }
.lesson { display: block; width: 100%; padding: 0; text-align: left; background: none; border: 0; color: inherit; }
.lesson-th { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--bg-active); border: 1px solid var(--border-subtle); transition: transform .3s var(--ease), border-color .2s, box-shadow .3s; }
.lesson-th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lesson-th::after { content: ''; position: absolute; inset: 0; background: rgba(var(--ink-rgb), .38); transition: background .2s; }
.lesson-play { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; }
.lesson-play i { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.94); color: var(--ink); transition: transform .25s var(--ease); }
.lesson-play .ic { width: 16px; height: 16px; fill: currentColor; stroke: none; margin-left: 2px; }
.lesson-n { max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; position: absolute; z-index: 2; top: 8px; left: 8px; min-width: 28px; height: 28px; padding: 0 8px; display: grid; place-items: center; border-radius: 8px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(var(--ink-rgb), .66); border: 1px solid rgba(255,255,255,.18); }
.lesson:hover .lesson-th, .lesson:focus-visible .lesson-th { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: 0 16px 36px rgba(0,0,0,.5), 0 0 28px var(--accent-glow); }
.lesson:hover .lesson-th::after { background: rgba(var(--ink-rgb), .12); }
.lesson:hover .lesson-play i { transform: scale(1.1); }
.lesson b { display: block; margin-top: var(--s1); font-size: 14px; font-weight: 600; line-height: 1.35; letter-spacing: -.005em; }

/* ── E-BOOKS ── */
.books { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--s3); }
.book { display: grid; grid-template-columns: 180px 1fr; gap: var(--s3); padding: var(--s3); border-radius: 20px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); transition: border-color .2s, transform .25s var(--ease); }
.book:hover { border-color: var(--border-strong); transform: translateY(-3px); }
.book-img { position: relative; align-self: start; border-radius: 12px; overflow: hidden; background: var(--bg-active); box-shadow: 0 16px 36px rgba(0,0,0,.45); }
.book-img img { width: 100%; display: block; aspect-ratio: 434 / 499; object-fit: cover; }
.book-price { position: absolute; top: 8px; left: 8px; height: 28px; padding: 0 10px; display: grid; place-items: center; border-radius: 8px; font-size: 13px; font-weight: 700; color: #fff; background: var(--accent-gradient); }
.book-body { display: flex; flex-direction: column; min-width: 0; }
.book-body small { align-self: flex-start; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; margin-bottom: 8px; border: 1px solid rgba(var(--accent-rgb), .55); border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.book-body h3 { margin: 4px 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.book-body em { font-style: normal; font-size: 14px; font-weight: 500; color: var(--text-secondary); }
.book-body p { margin: var(--s2) 0 var(--s3); font-size: 15px; line-height: 1.6; color: var(--text-secondary); }
.book-cta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); margin-top: auto; }
.btn-line { background: transparent; color: var(--text-primary); border-color: var(--border-default); }
.btn-line:hover { border-color: var(--border-strong); background: var(--bg-hover); }

/* ── LINHAS DE MATERIAL ── */
.rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--s3); }
.row {
  display: flex; align-items: center; gap: var(--s2); padding: var(--s3);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--r-card);
  transition: border-color .2s, background .2s, transform .25s var(--ease);
}
button.row { width: 100%; text-align: left; color: inherit; }
.row:hover { border-color: var(--border-strong); background: var(--bg-hover); transform: translateY(-2px); }
.row-ic { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: var(--bg-active); color: var(--accent); flex: none; }
.row-ic .ic { width: 24px; height: 24px; }
.row div b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.row div > span { display: block; margin-top: 2px; font-size: 14px; color: var(--text-secondary); }
.row .chev { margin-left: auto; color: var(--text-tertiary); }
.row.soon { opacity: .8; }
.tag-soon { margin-left: auto; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-default); color: var(--text-tertiary); white-space: nowrap; }

/* ── RESULTADOS (vazio elegante) ── */
.quote {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s4);
  border: 1px dashed var(--border-default); border-radius: var(--r-card);
  color: var(--text-secondary); font-size: 16px; line-height: 1.6;
}
.quote .row-ic { background: transparent; border: 1px solid var(--border-default); }

/* ── FOOTER ── */
.footer { margin-top: var(--sec); border-top: 1px solid var(--border-subtle); }
.footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: var(--s4); padding-bottom: var(--s4); }
.footer .brand img { height: 32px; width: 32px; opacity: .9; }
.footer-copy { font-size: 13px; color: var(--text-tertiary); }
.footer a.btn { height: 44px; font-size: 14px; padding: 0 20px; }

/* ── BARRA INFERIOR (celular) ── */
.tabbar { display: none; }

/* ── MODAL ── */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(2,5,10,.82); backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.modal.open { opacity: 1; pointer-events: auto; }
.modal-panel { width: 100%; max-width: 880px; max-height: calc(100vh - 48px); overflow: auto; border-radius: 20px; background: var(--bg-elevated); border: 1px solid var(--border-default); box-shadow: 0 40px 100px rgba(0,0,0,.7); transform: translateY(12px) scale(.98); transition: transform .3s var(--ease); }
.modal.open .modal-panel { transform: none; }
.m-video { position: relative; aspect-ratio: 16 / 9; background: #02050A; display: grid; place-items: center; }
.m-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.m-soon { display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--text-secondary); font-size: 15px; }
.m-soon .row-ic { width: 64px; height: 64px; border-radius: 50%; }
.m-close { position: absolute; top: 14px; right: 14px; z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-default); background: rgba(var(--ink-rgb), .7); color: #fff; display: grid; place-items: center; }
.m-body { padding: 28px; }
.m-body h3 { margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.m-body p { margin: 0 0 20px; font-size: 15px; line-height: 1.65; color: var(--text-secondary); }

/* ── MOVIMENTO (flat, suave, estilo landing page moderna) ── */
.rv { opacity: 0; transform: translateY(22px); filter: blur(10px); transition: opacity .85s var(--ease), transform .85s var(--ease), filter .85s var(--ease); transition-delay: calc(var(--d, 0) * 70ms); }
.rv.in { opacity: 1; transform: none; filter: blur(0); }
.fadein { opacity: 0; transform: scale(1.03); transition: opacity .7s var(--ease), transform .9s var(--ease); }
.fadein.ld { opacity: 1; transform: none; }
@keyframes pop { from { opacity: 0; transform: scale(.94); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
.panel { transition: height .5s var(--ease); }
.panel.morph { overflow: hidden; }
.panel > * { transition: opacity .22s ease, transform .22s ease, filter .22s ease; transform-origin: 50% 40%; }
.panel.out > * { opacity: 0; transform: scale(.97); filter: blur(4px); }
.lessons > *, #favBox > * { animation: pop .5s var(--ease) both; }
.lessons > *:nth-child(n+2) { animation-delay: .04s; } .lessons > *:nth-child(n+3) { animation-delay: .08s; } .lessons > *:nth-child(n+4) { animation-delay: .12s; }
.topbar { transition: box-shadow .3s, background .3s; }
.topbar.scrolled { box-shadow: 0 12px 32px rgba(0,0,0,.28); }
html[data-theme="light"] .topbar.scrolled { box-shadow: 0 8px 28px rgba(var(--accent-rgb), .10); }
html[data-theme="light"] .flow .poster.is-c .poster-art { box-shadow: 0 30px 60px rgba(20,40,70,.28), 0 0 44px var(--accent-glow); }
/* hero branco azul prata */
html[data-theme="light"] .hero {
  background: linear-gradient(160deg, #FFFFFF 0%, #F4F8FC 55%, #EBF2F8 100%);
  color: #0D2A3A;
}
html[data-theme="light"] .hero::before {
  background: radial-gradient(ellipse 70% 60% at 90% 40%, rgba(160,185,210,0.18) 0%, transparent 65%);
}

}

html[data-theme="light"] .eyebrow {

  background: rgba(26,92,130,0.05);
}
html[data-theme="light"] .hero-photo-wrap {
  box-shadow: 0 24px 64px rgba(26,92,130,0.14), 0 0 0 1px rgba(160,185,210,0.4);

}

  background: rgba(26,92,130,0.07);
  border-color: rgba(26,92,130,0.18);
  color: #1A5C82;
}
.hero-vest-logo-wrap {
  display: inline-block;
  margin-bottom: 22px;
  background: transparent;
  border-radius: 0;
  padding: 0;
  box-shadow: none;
}

  display: block;
  width: 280px;
  height: auto;
  mix-blend-mode: screen;
}

  box-shadow: none;
}
html[data-theme="light"] .hero-vest-logo {
  mix-blend-mode: multiply;
  filter: brightness(0.85) contrast(1.1);
}
.hero-img, .hero-in { will-change: transform, opacity, filter; }
::selection { background: rgba(var(--accent-rgb), .35); }
html { scrollbar-width: thin; scrollbar-color: rgba(var(--accent-rgb), .45) transparent; }
.shine { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255,255,255,.16), transparent 46%); }
.poster:hover .shine { opacity: 1; }
/* TOQUE (celular/tablet): capa fica firme no eixo. O efeito de levantar é só do mouse;
   no toque o :hover "gruda" e a capa subia e crescia durante o arrasto. */
@media (hover: none) {
  .poster:hover .poster-art, .poster:focus-visible .poster-art { transform: none; box-shadow: none; border-color: var(--border-subtle); }
  .poster:hover .poster-art img { transform: none; }

  .poster:hover .poster-title { opacity: 1; }
  .poster:hover .poster-play { opacity: 0; }
  .poster:active .poster-art { transform: scale(.98); transition-duration: .12s; }
  .poster-art img, .lesson-th img, .book-img img { -webkit-user-drag: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  #courseGrid, .lessons { touch-action: pan-x pan-y; overscroll-behavior: contain; }
  #courseGrid .poster, .lessons > * { touch-action: pan-x pan-y; }
}
@media (hover: hover) {
  .poster:hover .poster-art, .poster:focus-visible .poster-art { transform: translateY(-6px) perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1.02); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .rv, .fadein { opacity: 1; transform: none; filter: none; }
  .hero-img, .hero-in { transform: none !important; filter: none !important; opacity: 1 !important; }
}

/* ── RESPONSIVO ── */
@media (max-width: 1180px) {
  .books { grid-template-columns: 1fr; }
  .grid, .grid-4 { grid-template-columns: repeat(2, 1fr); gap: var(--s3); }

}

  .nav { display: none; }
  .topbar { gap: 12px; }
  .search.open, .search:focus-within { position: absolute; left: var(--pad); right: var(--pad); width: auto; top: 12px; z-index: 5; }
  .hero { min-height: 0; }
  .hero-in { flex-direction: column; gap: 32px; padding: 40px var(--pad) var(--s5); }
  .hero-photo-wrap { flex: none; width: 100%; height: min(80vw, 400px); }

  .next { grid-template-columns: auto 1fr; gap: 16px; }

  .footer .wrap { flex-direction: column; align-items: flex-start; padding-bottom: 96px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg-base) 92%, transparent); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-default);
  }
  .tabbar { grid-template-columns: repeat(var(--n, 4), 1fr) !important; }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); border-radius: 12px; }
  .tabbar a.on { color: var(--accent); }

}
@media (max-width: 560px) {
  .lessons > .lesson { flex: none; }
  .lessons { justify-content: start; display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 78%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; padding-bottom: 8px; scrollbar-width: none; margin-inline: calc(var(--s2) * -1); padding-inline: var(--s2); }
  .lessons::-webkit-scrollbar { display: none; }

  .book { grid-template-columns: 1fr; }
  .book-img { max-width: 220px; }
  .panel { padding: var(--s2); }
  .grid { grid-template-columns: repeat(2, 1fr); gap: var(--s3) var(--s2); }
  .brand-txt span { display: none; }
  .poster-cap b { font-size: 14px; }
  .m-body { padding: 20px; }
  .modal { padding: 12px; }
}

/* ── CAPA SEM IMAGEM (fallback automático na cor do cliente) ── */
.poster-art.nocover { background: radial-gradient(120% 70% at 70% 28%, rgba(var(--accent-rgb), .55) 0%, rgba(var(--accent-rgb), .14) 42%, transparent 72%), linear-gradient(180deg, var(--bg-active), var(--ink)); }
.poster-art.nocover::before { content: attr(data-n); position: absolute; right: 10%; top: 8%; font-size: clamp(72px, 9vw, 120px); font-weight: 800; letter-spacing: -.04em; color: rgba(var(--accent-rgb), .32); line-height: 1; }
.hero.noimg { background: radial-gradient(70% 95% at 78% 30%, rgba(var(--accent-rgb), .5) 0%, rgba(var(--accent-rgb), .14) 45%, transparent 72%), var(--ink); }
/* foto de banco de imagens: duotone na cor do cliente (só quando o módulo marca stock: true) */
.poster.stock .poster-art img { filter: grayscale(1) contrast(1.1) brightness(.75); }
.poster.stock .poster-art::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(160deg, rgba(var(--accent-rgb), .9) 0%, rgba(var(--ink-rgb), .95) 100%); mix-blend-mode: color; }
.sign { font-size: 12px; letter-spacing: .08em; color: var(--text-tertiary); }
.sign b { font-weight: 600; color: var(--text-secondary); }
.footer .wrap { flex-wrap: wrap; }


/* ── ETIQUETAS (informação solta vira chip só com o traço) ── */
.chips { display: flex; flex-wrap: wrap; gap: var(--s1) 12px; }
.chip { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border: 1px solid rgba(var(--accent-rgb), .55); border-radius: 999px; font-size: 14px; font-weight: 500; letter-spacing: .01em; color: rgba(232,238,248,.92); background: transparent; white-space: nowrap; }
.chip-s { height: 26px; padding: 0 10px; font-size: 12px; border-color: var(--border-default); color: var(--text-secondary); }
/* ── FAVORITOS E JÁ VISTO ── */
.fav { position: absolute; z-index: 3; top: 6px; right: 6px; display: grid; place-items: center; width: 44px; height: 44px; border: 0; background: none; color: #fff; cursor: pointer; padding: 0; }
.fav i { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(var(--ink-rgb), .62); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.22); transition: transform .2s var(--ease), background .2s; }
.fav .ic { width: 16px; height: 16px; }
.fav:hover i { transform: scale(1.12); }
.fav.on i { background: var(--accent-gradient); border-color: transparent; color: var(--accent-text); }
.fav.on .ic { fill: currentColor; }
.m-fav { top: 8px; right: 62px; }
/* MODO FOCO (olho): escurece e desfoca tudo em volta, fica só o vídeo */
.m-eye { position: absolute; z-index: 3; top: 14px; right: 112px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-default); background: rgba(var(--ink-rgb), .7); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .3s, border-color .3s, box-shadow .3s; }
.m-eye .ic { width: 20px; height: 20px; grid-area: 1 / 1; transition: opacity .3s, transform .4s cubic-bezier(.62,0,.22,1); }
.m-eye .ic-shut { opacity: 0; transform: scale(.6); }
#modal.focus .m-eye { background: var(--accent-gradient); border-color: transparent; color: var(--accent-text); box-shadow: 0 0 24px var(--accent-glow); }
#modal.focus .m-eye .ic-open { opacity: 0; transform: scale(.6); }
#modal.focus .m-eye .ic-shut { opacity: 1; transform: scale(1); }
.m-body, .m-head { transition: opacity .5s ease, filter .5s ease; }
#modal.focus { background: rgba(0,0,0,.94); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
#modal.focus .modal-panel { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
#modal.focus .m-body, #modal.focus .m-head { opacity: .05; filter: blur(14px); pointer-events: none; }
#modal.focus .m-fav { opacity: 0; pointer-events: none; }
.poster-new { right: 10px; }
.lesson.seen .lesson-n::after, .poster.seen .poster-num::after { content: ' ✓'; color: var(--accent-soft); }
.cnt { margin-left: 6px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent-gradient); color: var(--accent-text); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.tabbar .cnt { position: absolute; margin: -4px 0 0 18px; }
.tabbar a { position: relative; }
#favoritos { display: none; }
body.favs #favoritos { display: block; padding-top: var(--s4); }
body.favs .hero, body.favs .next, body.favs .sec:not(#favoritos) { display: none; }
.fav-sub { margin: var(--s3) 0 var(--s2); font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); }
.fav-empty { padding: var(--s5) var(--s3); text-align: center; border: 1px dashed var(--border-default); border-radius: var(--r-card); color: var(--text-secondary); font-size: 16px; line-height: 1.6; }
.fav-empty .ic { width: 28px; height: 28px; margin-bottom: 8px; color: var(--accent); }
.skel { grid-column: 1 / -1; width: 100%; border-radius: var(--r-card); background: linear-gradient(100deg, var(--bg-elevated) 30%, var(--bg-hover) 50%, var(--bg-elevated) 70%); background-size: 220% 100%; animation: skel 1.4s linear infinite; }
@keyframes skel { to { background-position: -220% 0; } }
.m-actions { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); margin-top: var(--s2); }
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 300; transform: translate(-50%, 20px); padding: 12px 20px; border-radius: 999px; background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text-primary); font-size: 14px; font-weight: 500; box-shadow: 0 16px 40px rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s var(--ease); }

@media (max-width: 860px) { .toast { bottom: calc(92px + env(safe-area-inset-bottom)); } }
.gate { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: var(--s3); background: var(--bg-base); }
.gate form { width: min(420px, 100%); display: grid; gap: var(--s2); text-align: center; }
.gate h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.gate p { margin: 0; color: var(--text-secondary); font-size: 15px; }
.gate input { height: 52px; padding: 0 16px; border-radius: var(--r-btn); border: 1px solid var(--border-default); background: var(--bg-elevated); color: var(--text-primary); font: inherit; font-size: 16px; text-align: center; outline: none; }
.gate input:focus { border-color: var(--border-strong); }
.gate .err { color: #F87171; font-size: 14px; min-height: 20px; }

/* ── CSS MODERNO (cada recurso com plano B; ver docs/padrao-zeus-cinematic.md) ── */
:root { color-scheme: dark; interpolate-size: allow-keywords; scrollbar-gutter: stable; }
html[data-theme="light"] { color-scheme: light; }
button, a, [role="button"], input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, .poster-title > span, .next-title, .book-body h3 { text-wrap: balance; }
p, .book-body p, .m-body p, .hero p { text-wrap: pretty; }
.sec { content-visibility: auto; contain-intrinsic-size: auto 560px; margin-inline: calc(var(--pad) * -1); padding-inline: var(--pad); }   /* a caixa de recorte cobre a largura toda: sombras e o carrossel 3D não são cortados */
.modal-panel { overscroll-behavior: contain; max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; animation-timing-function: var(--ease); }
@media (pointer: coarse) { .rv { filter: none; } }
/* rolagem do topo fora da thread principal (Chrome, Edge, Safari 26). Sem suporte: o JS faz o mesmo. */
@supports (animation-timeline: scroll()) {
  .hero-img { animation: heroZoom linear both; animation-timeline: scroll(root); animation-range: 0 85vh; }
  .hero-in { animation: heroOut linear both; animation-timeline: scroll(root); animation-range: 0 70vh; }
  @keyframes heroZoom { to { transform: scale(1.07); } }
  @keyframes heroOut { to { opacity: 0; filter: blur(10px); transform: translate3d(0, 60px, 0); } }
  @keyframes heroOutSoft { to { opacity: 0; transform: translate3d(0, 60px, 0); } }
  @media (pointer: coarse) { .hero-in { animation-name: heroOutSoft; } }
}

/* ── JORNADA EM CARROSSEL 3D INFINITO (movimento contínuo conduzido por JS: ease-in-out, profundidade de campo) ── */
.flowwrap { display: block; perspective: 1600px; perspective-origin: 50% 38%; }
.flow { --fw: clamp(190px, 19vw, 270px); position: relative; height: calc(var(--fw) * 5 / 3 + 84px); transform-style: preserve-3d; user-select: none; -webkit-user-select: none; touch-action: pan-y; outline: none; cursor: grab; }
.flow:active { cursor: grabbing; }
.flow .poster { position: absolute; top: 0; left: 50%; width: var(--fw); margin-left: calc(var(--fw) / -2); transform-style: preserve-3d; backface-visibility: hidden; transition: none; }
.flow .poster[data-h] { visibility: hidden; pointer-events: none; }
.flow .poster .poster-art { transform: none !important; }
.flow .poster.is-c .poster-art { border-color: var(--border-strong); box-shadow: 0 34px 80px rgba(0,0,0,.6), 0 0 64px var(--accent-glow); }
.flow .poster:not(.is-c) .poster-play { display: none; }
/* título só no card do centro: os de lado nunca ficam cortados nem em cima de outro */
.flow .poster .poster-title { transition: opacity .35s ease; }
.flow .poster:not(.is-c) .poster-title { opacity: 0; }
.flow .poster-cap { opacity: var(--c, 0); text-align: center; }
.flow .poster-cap .chip { margin-inline: auto; }
.flow-ui { display: flex; align-items: center; justify-content: center; gap: var(--s3); margin-top: var(--s2); }
.flow-ui .icon-btn { width: 48px; height: 48px; border: 1px solid var(--border-default); border-radius: 999px; background: color-mix(in srgb, var(--bg-elevated) 70%, transparent); transition: border-color .25s, background .25s, transform .25s var(--ease); }
.flow-ui .icon-btn:hover { border-color: var(--border-strong); background: var(--bg-hover); transform: scale(1.06); }
.flow-ui .icon-btn:active { transform: scale(.94); }
.flow-ui .flow-prev .ic { transform: rotate(180deg); }
.flow-dots { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border: 1px solid var(--border-default); border-radius: 999px; background: color-mix(in srgb, var(--bg-elevated) 70%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.flow-dots button { position: relative; width: 10px; height: 10px; padding: 0; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .5); background: transparent; cursor: pointer; overflow: hidden; transition: width .6s var(--ease), border-color .3s; }
.flow-dots button:hover { border-color: var(--accent); }
.flow-dots button.on { width: 40px; border-color: var(--accent); }
.flow-dots button i { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(var(--accent-rgb), .55), var(--accent-soft)); transform-origin: left; transform: scaleX(0); }
.flow-dots button.on i { animation: dotfill var(--ap, 4600ms) linear forwards; }

@keyframes dotfill { to { transform: scaleX(1); } }
@media (max-width: 860px) { .flow { --fw: clamp(176px, 54vw, 232px); height: calc(var(--fw) * 5 / 3 + 56px); } .flow-ui { gap: var(--s2); margin-top: 0; } .flow-ui .icon-btn { width: 54px; height: 54px; } .flow-ui .icon-btn .ic { width: 22px; height: 22px; } .flow-dots { padding: 12px 16px; gap: 9px; } .flowwrap { perspective: 1100px; perspective-origin: 50% 36%; } }

/* ── INSTALAR COMO APP (pop-up de baixo, com fundo escurecido) ── */
.sheet { position: fixed; inset: 0; z-index: 250; display: flex; align-items: flex-end; justify-content: center; padding: var(--s2); padding-bottom: calc(var(--s2) + env(safe-area-inset-bottom)); pointer-events: none; }
.sheet::before { content: ''; position: absolute; inset: 0; background: rgba(var(--ink-rgb), .72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; transition: opacity .4s ease; }
.sheet.on { pointer-events: auto; }
.sheet.on::before { opacity: 1; }
.sheet-card { position: relative; width: min(520px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: var(--s3); border-radius: 24px; background: var(--bg-elevated); border: 1px solid var(--border-strong); box-shadow: 0 -10px 60px rgba(0,0,0,.55), 0 0 60px var(--accent-glow); transform: translateY(40px); opacity: 0; transition: transform .55s var(--ease), opacity .35s ease; }
.sheet.on .sheet-card { transform: none; opacity: 1; }
.sheet-top { display: flex; gap: var(--s2); align-items: center; margin-bottom: var(--s3); }
.sheet-ic { display: grid; place-items: center; flex: none; width: 60px; height: 60px; border-radius: 16px; overflow: hidden; background: var(--bg-active); border: 1px solid var(--border-default); }
.sheet-ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet h3 { margin: 0 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-secondary); }
.sheet-btns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s1); margin-top: var(--s3); }
.sheet-card > .btn { display: flex; }

.sheet-card .btn .ic { fill: none; stroke: currentColor; }

.sheet-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--s2); counter-reset: st; }
.sheet-steps li { display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start; counter-increment: st; font-size: 15px; line-height: 1.5; color: var(--text-primary); }
.sheet-steps li::before { content: counter(st); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .6); font-size: 14px; font-weight: 700; color: var(--accent); }
.sheet-steps li > span { padding-top: 4px; }
.sheet-steps b { font-weight: 600; }
.sheet-steps .ic { display: inline-block; width: 18px; height: 18px; margin: 0 2px; vertical-align: -3px; color: var(--accent); }
.sheet-note { margin-top: var(--s2); padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--border-default); font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
@media (min-width: 861px) { .sheet { display: none; } }

/* ── CELULAR: uso essencial. O computador mostra mais; aqui só o que a pessoa precisa para continuar e navegar ── */
@media (max-width: 860px) {
  :root { --sec: 36px; }
  /* topo: foto como card, texto abaixo */
  .hero { display: block; height: auto; min-height: 0; }
  .hero-photo-wrap { height: min(80vw, 380px); border-radius: 0 0 8px 8px; }
  .hero-in { flex-direction: column; gap: 28px; padding: 0 var(--pad) var(--s5); margin-top: 0; }
  .hero-copy { flex: none; width: 100%; }
  .eyebrow { height: 30px; padding: 0 12px; margin-bottom: var(--s2); font-size: 11px; }
  .hero h1 { font-size: clamp(26px, 7.4vw, 32px); margin-bottom: var(--s3); }
  .hero p, .hero .btn-ghost, .hero-meta { display: none; }
  .hero-cta { margin-bottom: 0; }
  body.has-next .hero-cta { display: none; }
  .hero-cta .btn { flex: 1 1 100%; }
  .next { margin-top: calc(var(--s3) * -1); }
  .next-sub { display: none; }
  .sec-head small, #count, #courseCount { display: none; }
  .sec-head { margin-bottom: var(--s2); }
  /* curso: módulos em uma fileira que desliza */
  #courseGrid { display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 46%; overflow-x: auto; overflow-y: hidden; overscroll-behavior: contain; padding-bottom: 28px; scroll-snap-type: x mandatory; scrollbar-width: none; gap: var(--s2); margin-inline: calc(var(--s2) * -1); padding-inline: var(--s2); }
  #courseGrid::-webkit-scrollbar { display: none; }

  /* e-books compactos: capa ao lado, só o essencial */
  .book { grid-template-columns: 96px 1fr; gap: var(--s2); padding: var(--s2); }

  /* resultados vazio e assinatura saem do celular */

  .footer .wrap { padding-top: var(--s3); padding-bottom: 96px; gap: var(--s2); }
}

/* ── GUIA ANIMADO DE INSTALAÇÃO (iPhone e Android desenhados em código, na cor e com o ícone do cliente) ── */
.guide { position: relative; height: 252px; margin-bottom: var(--s2); border-radius: 20px; overflow: hidden; background: #0b0b0d; border: 1px solid var(--border-default); font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; color: #fff; --g: 12s; }
.scn { position: absolute; inset: 0; opacity: 0; animation: scn var(--g) infinite; animation-delay: calc(var(--i) * (var(--g) / var(--n)) - .02s); }
@keyframes scn { 0% { opacity: 0; transform: scale(1.03); } 4%, 21% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; } }
.guide[data-n="3"] { --n: 3; } .guide[data-n="4"] { --n: 4; }
.guide[data-n="3"] .scn { animation-name: scn3; } .guide[data-n="3"] .gcap > span { animation-name: scn3; }
@keyframes scn3 { 0% { opacity: 0; transform: scale(1.03); } 5%, 28% { opacity: 1; transform: none; } 33%, 100% { opacity: 0; } }
.gcap { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; z-index: 5; background: linear-gradient(0deg, rgba(0,0,0,.9), rgba(0,0,0,0)); }
.gcap > span { position: absolute; left: 12px; right: 12px; bottom: 9px; text-align: center; font-size: 13px; font-weight: 600; opacity: 0; animation: scn var(--g) infinite; animation-delay: calc(var(--i) * (var(--g) / var(--n)) - .02s); }
.fk-bg { position: absolute; inset: 0; background: radial-gradient(120% 80% at 70% 0%, rgba(var(--accent-rgb), .45), transparent 60%), #111; filter: blur(1px); }
.fk-menu, .fk-list, .fk-add { position: absolute; left: 14px; right: 14px; background: #2a2a2d; border-radius: 16px; overflow: hidden; }
.fk-menu { top: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.fk-row { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 38px; padding: 0 14px; font-size: 14px; border-bottom: 1px solid #3a3a3d; }
.fk-row:last-child { border-bottom: 0; }
.fk-row .ic { width: 17px; height: 17px; color: #fff; opacity: .9; }
.fk-row.hi { background: rgba(var(--accent-rgb), .28); font-weight: 600; }
.tap { position: absolute; right: 22px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; border: 2px solid var(--accent-soft); background: rgba(var(--accent-rgb), .35); opacity: 0; animation: tap var(--g) infinite; animation-delay: calc(var(--i) * (var(--g) / var(--n)) + .9s); }
@keyframes tap { 0% { opacity: 0; transform: scale(.4); } 3% { opacity: 1; transform: scale(1); } 8% { transform: scale(.8); } 12%, 100% { opacity: 0; transform: scale(1.5); } }
.guide[data-n="3"] .tap { animation-name: tap3; }
@keyframes tap3 { 0% { opacity: 0; transform: scale(.4); } 4% { opacity: 1; transform: scale(1); } 9% { transform: scale(.8); } 14%, 100% { opacity: 0; transform: scale(1.5); } }
.fk-apps { position: absolute; left: 14px; right: 14px; top: 14px; display: flex; gap: 16px; animation: fkapps var(--g) infinite; animation-delay: calc(var(--i) * (var(--g) / var(--n))); }
@keyframes fkapps { 0%, 4% { opacity: 1; } 14%, 25%, 100% { opacity: 0; } }
.guide[data-n="3"] .fk-apps { animation-name: fkapps3; } @keyframes fkapps3 { 0%, 5% { opacity: 1; } 17%, 33%, 100% { opacity: 0; } }
.fk-apps b { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #4aa3ff, #2563eb); }
.fk-apps b:nth-child(2) { background: linear-gradient(135deg, #7ee27e, #32a852); } .fk-apps b:nth-child(3) { background: linear-gradient(135deg, #8fd0ff, #3a7bd5); } .fk-apps b:nth-child(4) { background: #f3f3f3; }
.fk-list { top: 74px; bottom: 0; border-radius: 16px 16px 0 0; animation: fkscroll var(--g) infinite; animation-delay: calc(var(--i) * (var(--g) / var(--n))); }
@keyframes fkscroll { 0%, 4% { transform: translateY(0); } 14%, 25%, 100% { transform: translateY(-62px); } }
.guide[data-n="3"] .fk-list { animation-name: fkscroll3; } @keyframes fkscroll3 { 0%, 5% { transform: translateY(0); } 17%, 33%, 100% { transform: translateY(-62px); } }
.fk-add { top: 14px; bottom: 14px; background: #1c1c1e; padding: 12px; }
.fk-addtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.fk-addtop > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
.fk-addtop .x { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #3a3a3d; font-weight: 400; }
.fk-addtop .go { position: relative; flex: none; padding: 7px 14px; border-radius: 999px; background: #3b82f6; font-size: 13px; font-weight: 700; }
.fk-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #2a2a2d; }
.fk-card img { width: 52px; height: 52px; border-radius: 13px; object-fit: cover; }
.fk-card .nm { font-size: 15px; font-weight: 600; } .fk-card .url { margin-top: 3px; font-size: 11px; color: #8e8e93; }
.fk-tg { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 11px 12px; border-radius: 12px; background: #2a2a2d; font-size: 13px; }
.fk-tg i { width: 40px; height: 24px; border-radius: 999px; background: #34c759; position: relative; } .fk-tg i::after { content: ''; position: absolute; right: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.fk-home { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 10px; align-content: start; padding: 22px 18px; background: radial-gradient(120% 90% at 50% 0%, rgba(var(--accent-rgb), .35), transparent 65%), #0d0d10; }
.fk-home b { aspect-ratio: 1; border-radius: 14px; background: linear-gradient(135deg, #3a3f4a, #23262d); }
.fk-home .me { position: relative; aspect-ratio: 1; }
.fk-home .me img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .8); animation: pop var(--g) infinite; animation-delay: calc(var(--i) * (var(--g) / var(--n))); }
.fk-home .me span { position: absolute; left: -6px; right: -6px; top: calc(100% + 4px); text-align: center; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes pop { 0%, 6% { transform: scale(.3); opacity: 0; } 12% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 0 10px rgba(var(--accent-rgb), .0), 0 0 30px rgba(var(--accent-rgb), .9); } 17%, 24% { transform: scale(1); opacity: 1; box-shadow: 0 0 22px rgba(var(--accent-rgb), .7); } 100% { opacity: 1; } }
.fk-btnui { position: absolute; left: 14px; right: 14px; bottom: 50px; height: 50px; border-radius: 14px; background: var(--accent-gradient); color: var(--accent-text); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; }
.fk-btnui .ic { width: 18px; height: 18px; color: inherit; }
.fk-btnui .tap { right: 22%; }
.fk-dialog { position: absolute; left: 20px; right: 20px; top: 26px; padding: 16px; border-radius: 18px; background: #2a2a2d; text-align: center; }
.fk-dialog h4 { margin: 10px 0 4px; font-size: 15px; } .fk-dialog p { margin: 0 0 14px; font-size: 12px; color: #aaa; }
.fk-dialog img { width: 54px; height: 54px; border-radius: 13px; }
.fk-dlgbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .fk-dlgbtns span { position: relative; padding: 10px; border-radius: 12px; background: #3a3a3d; font-size: 13px; font-weight: 600; } .fk-dlgbtns span.hi { background: #3b82f6; }
@media (prefers-reduced-motion: reduce) { .scn:first-child, .gcap > span:first-child { opacity: 1 !important; } }

/* ── PERFIL: o aluno troca a letra pela própria foto desde o primeiro uso ── */
.avatar { position: relative; overflow: hidden; cursor: pointer; padding: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.hint { animation: hintpulse 2.6s ease-out infinite; }
@keyframes hintpulse { 0% { box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 3px var(--border-default), 0 0 0 3px rgba(var(--accent-rgb), .7); } 70%, 100% { box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 3px var(--border-default), 0 0 0 12px rgba(var(--accent-rgb), 0); } }
.sheet.prof { z-index: 260; }
@media (min-width: 861px) { .sheet.prof { display: flex; align-items: center; } }
.prof-top { display: flex; gap: var(--s3); align-items: center; margin-bottom: var(--s3); }
.prof-av { position: relative; flex: none; display: grid; place-items: center; width: 92px; height: 92px; padding: 0; border-radius: 50%; overflow: visible; border: 0; background: var(--accent-gradient); color: var(--accent-text); font-size: 36px; font-weight: 700; cursor: pointer; box-shadow: 0 0 0 3px var(--bg-elevated), 0 0 0 4px var(--border-strong); }
.prof-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.prof-cam { position: absolute; right: -2px; bottom: -2px; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--accent); }

.prof-lbl { display: grid; gap: 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.prof-lbl input { height: 52px; padding: 0 16px; border-radius: var(--r-btn); border: 1px solid var(--border-default); background: var(--bg-base); color: var(--text-primary); font: inherit; font-size: 16px; outline: none; }
.prof-lbl input:focus { border-color: var(--border-strong); }
.sheet-btns .btn:disabled { opacity: .4; pointer-events: none; }

/* ── MODO MARATONA: barra do módulo + próximas aulas dentro da aula aberta ── */
.m-next { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--border-subtle); }
.un-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.un-head b { font-size: 15px; font-weight: 700; }
.un-head span { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; }
.un-bar { height: 5px; margin-bottom: var(--s2); border-radius: 999px; background: rgba(var(--accent-rgb), .2); overflow: hidden; }
.un-bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent-gradient); box-shadow: 0 0 10px rgba(var(--accent-rgb), .6); transition: width .9s var(--ease); }
.un-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.un-it { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 8px 14px; border-radius: 14px; border: 1px solid var(--border-subtle); background: var(--bg-base); color: var(--text-primary); text-align: left; font: inherit; font-size: 14px; cursor: pointer; transition: border-color .2s, background .2s; }
.un-it:hover { border-color: var(--border-strong); }
.un-it.cur { border-color: var(--border-strong); background: rgba(var(--accent-rgb), .12); }
.un-it.ok { color: var(--text-secondary); }
.un-n { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .55); font-size: 12px; font-weight: 700; color: var(--accent); }
.un-it.ok .un-n { background: var(--accent-gradient); border-color: transparent; color: var(--accent-text); }
.un-t { flex: 1; min-width: 0; }
.un-it em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
@media (max-width: 860px) {
  .modal { padding: 0; place-items: stretch; }
  .modal-panel { max-width: none; max-height: none; height: 100%; border-radius: 0; border: 0; }
  .m-body { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  .m-body h3 { font-size: 22px; }
  #coursePanel { display: none; }
}

/* ── PLAYER PRÓPRIO (estilo Vimeo, na cor da marca): esconde marca, título e vermelho do YouTube ── */
.pl { position: absolute; inset: 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }
.pl-frame { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.pl-frame iframe { position: absolute; left: 0; top: -60px; width: 100%; height: calc(100% + 120px); border: 0; }
.pl-shield { position: absolute; inset: 0; z-index: 2; cursor: pointer; }
.pl::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 45%; z-index: 2; background: linear-gradient(0deg, rgba(var(--ink-rgb), .88), rgba(var(--ink-rgb), 0)); pointer-events: none; transition: opacity .35s; }
.pl.paused::before { content: ''; position: absolute; inset: 0; z-index: 2; background: rgba(var(--ink-rgb), .5); pointer-events: none; }
.pl-big { position: absolute; left: 50%; top: 50%; z-index: 4; display: grid; place-items: center; width: 88px; height: 58px; margin: -29px 0 0 -44px; border: 0; border-radius: 14px; background: var(--accent-gradient); color: var(--accent-text); box-shadow: 0 14px 40px var(--accent-glow); opacity: 0; transform: scale(.9); transition: opacity .25s, transform .4s var(--ease); pointer-events: none; cursor: pointer; }
.pl.paused .pl-big { opacity: 1; transform: none; pointer-events: auto; }
.pl-big:hover { filter: brightness(1.08); }
.pl-big .ic { width: 26px; height: 26px; margin-left: 3px; fill: currentColor; stroke: none; }
.pl-ui { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 0 14px 8px; transition: opacity .35s, transform .35s var(--ease); }
.pl.idle .pl-ui, .pl.idle::after { opacity: 0; }
.pl.idle .pl-ui { transform: translateY(8px); pointer-events: none; }
.pl.idle .pl-shield { cursor: none; }
.pl-seek { position: relative; height: 24px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.pl-track { position: relative; width: 100%; height: 5px; border-radius: 999px; background: rgba(255,255,255,.22); transition: height .2s; }
.pl-seek:hover .pl-track, .pl.drag .pl-track { height: 7px; }
.pl-track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: var(--accent-gradient); box-shadow: 0 0 12px rgba(var(--accent-rgb), .6); }
.pl-track b { position: absolute; top: 50%; left: 0; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .4); transform: scale(0); transition: transform .2s; }
.pl-seek:hover .pl-track b, .pl.drag .pl-track b { transform: scale(1); }
.pl-row { display: flex; align-items: center; gap: 2px; color: #fff; }
.pl-b { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #fff; cursor: pointer; transition: background .2s, color .2s; }
.pl-b:hover { background: rgba(255,255,255,.12); }
.pl-b .ic { width: 20px; height: 20px; }
.pl-b.fill .ic { fill: currentColor; stroke: none; }
.pl-b.on { color: var(--accent-soft); }
.pl-b:disabled { opacity: .3; pointer-events: none; }
.pl-time { margin-left: 6px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.92); white-space: nowrap; }

/* ── PLAYER: acabamento futurista (vidro, anel de luz, próxima aula com contagem) ── */
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.pl::after { height: 38%; }
.pl-ui { left: 12px; right: 12px; bottom: 12px; padding: 4px 10px 6px; border-radius: 18px; background: rgba(var(--ink-rgb), .55); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(var(--accent-rgb), .28); box-shadow: 0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
.pl-b { border-radius: 999px; }

.pl-time { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .3); font-size: 12px; }
.pl-track { height: 4px; background: rgba(255,255,255,.16); }
.pl-tip { position: absolute; bottom: 24px; left: 0; transform: translateX(-50%); padding: 4px 9px; border-radius: 8px; background: rgba(var(--ink-rgb), .92); border: 1px solid rgba(var(--accent-rgb), .45); color: #fff; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.pl-seek:hover .pl-tip, .pl.drag .pl-tip { opacity: 1; }
.pl-big { width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(var(--ink-rgb), .3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: none; }
.pl-big::before { content: ''; position: absolute; inset: 0; border-radius: 50%; padding: 2px; background: conic-gradient(from var(--ang), var(--accent-soft), transparent 28%, var(--accent) 55%, transparent 82%, var(--accent-soft)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spinring 4s linear infinite; }
.pl-big::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: var(--accent-gradient); box-shadow: 0 0 44px var(--accent-glow); }
.pl-big .ic { position: relative; z-index: 1; width: 28px; height: 28px; }
@keyframes spinring { to { --ang: 360deg; } }
.pl-info { position: absolute; left: 22px; right: 130px; top: 20px; z-index: 4; opacity: 0; transform: translateY(-6px); transition: opacity .35s, transform .45s var(--ease); pointer-events: none; }
.pl.paused .pl-info { opacity: 1; transform: none; }
.pl-info small { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .55); background: rgba(var(--ink-rgb), .5); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-soft); }
.pl-info b { display: block; margin-top: 10px; font-size: clamp(17px, 2.3vw, 26px); font-weight: 700; letter-spacing: -.02em; color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,.6); text-wrap: balance; }
.pl-end { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(var(--ink-rgb), .8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .45s; }
.pl-end.on { opacity: 1; pointer-events: auto; }
.pl-endc { display: grid; justify-items: center; gap: 14px; padding: 18px; text-align: center; }
.pl-endc small { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-soft); }
.pl-endc b { max-width: 520px; font-size: clamp(17px, 2.4vw, 26px); font-weight: 700; letter-spacing: -.02em; color: #fff; text-wrap: balance; }
.pl-ring { position: relative; width: 66px; height: 66px; }
.pl-ring svg { width: 66px; height: 66px; transform: rotate(-90deg); }
.pl-ring circle { fill: none; stroke-width: 4; }
.pl-ring .bg { stroke: rgba(255,255,255,.14); }
.pl-ring .fg { stroke: var(--accent-soft); stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 176; filter: drop-shadow(0 0 6px rgba(var(--accent-rgb), .8)); }
.pl-end.on .pl-ring .fg { animation: ringgo 5s linear forwards; }
@keyframes ringgo { to { stroke-dashoffset: 0; } }
.pl-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #fff; }
.pl-endb { display: flex; gap: 8px; }
.un-it.cur { box-shadow: 0 0 0 1px rgba(var(--accent-rgb), .35), 0 0 24px rgba(var(--accent-rgb), .18); }
@media (max-width: 560px) { .pl-ui { left: 8px; right: 8px; bottom: 8px; padding: 0 6px 2px; } .pl-info { display: none; } .pl-big { width: 64px; height: 64px; margin: -40px 0 0 -32px; } .pl-big::after { inset: 7px; } #plPrev, #plNext { display: none; } }

/* ── TELA DA AULA no conceito da casa: vidro líquido, página flutuando desfocada, aulas em carrossel 3D ── */
.modal { background: rgba(var(--ink-rgb), .42); backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%); perspective: 1600px; }
.modal-panel { background: color-mix(in srgb, var(--bg-elevated) 64%, transparent); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 40px 120px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(var(--accent-rgb), .18); transform: rotateX(7deg) translateY(36px) scale(.96); transform-origin: 50% 100%; opacity: 0; transition: transform .75s cubic-bezier(.62,0,.22,1), opacity .45s ease; }
.modal.open .modal-panel { transform: none; opacity: 1; }
html[data-theme="light"] .modal-panel { border-color: rgba(var(--accent-rgb), .25); }
html[data-theme="light"] .m-head small { color: var(--text-primary); }
html[data-theme="light"] .m-head small { background: rgba(255,255,255,.6); border-color: rgba(var(--accent-rgb), .8); }
.lflow-wrap { margin: var(--s2) calc(var(--s3) * -1) 0; padding: 0 var(--s3); overflow: hidden; perspective: 1400px; perspective-origin: 50% 40%; }
.lflow { --lw: clamp(220px, 26vw, 300px); position: relative; height: calc(var(--lw) * 9 / 16 + 62px); transform-style: preserve-3d; }
.lc { position: absolute; top: 0; left: 50%; width: var(--lw); margin-left: calc(var(--lw) / -2); padding: 0; border: 0; background: none; color: var(--text-primary); text-align: left; cursor: pointer; transform-style: preserve-3d; backface-visibility: hidden; transition: transform .95s cubic-bezier(.62,0,.22,1), opacity .7s ease, filter .7s ease; }
.lc[data-h] { visibility: hidden; pointer-events: none; }
.lflow-wrap { touch-action: none; overscroll-behavior: contain; user-select: none; -webkit-user-select: none; cursor: grab; }
.lflow.drag .lc, .lflow.drag .lc-th { transition: none; }
.lc-go-wrap { display: flex; justify-content: center; margin-top: var(--s2); min-height: 38px; }
.lc-go { height: 36px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(var(--accent-rgb), .6); background: transparent; color: var(--text-primary); font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .02em; cursor: pointer; opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity .35s ease, transform .35s cubic-bezier(.62,0,.22,1), background .2s, border-color .2s; }
.lc-go.on { opacity: 1; transform: none; pointer-events: auto; }
.lc-go:hover, .lc-go:focus-visible { background: rgba(var(--accent-rgb), .14); border-color: var(--accent); outline: none; }
.lflow-wrap img { -webkit-user-drag: none; pointer-events: none; }
.lc-th { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-subtle); background: var(--bg-active); transition: border-color .4s, box-shadow .5s, filter .7s ease; }
.lc-th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lc-th::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(var(--ink-rgb), .75), rgba(var(--ink-rgb), 0) 55%); }
.lc-th::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(var(--accent-rgb), .30), rgba(var(--accent-rgb), .46)); opacity: 1; transition: opacity .5s; pointer-events: none; }
.lc.cur .lc-th { border-color: var(--border-strong); box-shadow: 0 22px 54px rgba(0,0,0,.5), 0 0 44px var(--accent-glow); }
.lc-n { position: absolute; z-index: 2; top: 8px; left: 8px; display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; background: rgba(var(--ink-rgb), .6); border: 1px solid rgba(255,255,255,.18); font-size: 11px; font-weight: 700; color: #fff; }
.lc-st { position: absolute; z-index: 2; top: 8px; right: 8px; display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .55); background: rgba(var(--ink-rgb), .55); font-size: 11px; font-weight: 700; color: var(--accent-soft); }
.lc-st:empty { display: none; }
.lc b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; width: 100%; min-height: 2.6em; margin-top: 10px; font-size: 14px; font-weight: 600; line-height: 1.3; text-align: center; text-wrap: balance; transition: opacity .35s; }
.m-next .flow-ui { margin-top: var(--s1); }
#lcDots button.on i { animation: none; transform: scaleX(1); }
#lcDots button.done:not(.on) { background: rgba(var(--accent-rgb), .55); border-color: transparent; }
@media (max-width: 860px) { .lflow { --lw: 62vw; } .modal-panel { transform: translateY(40px); } }
.m-head { display: none; }
.m-done { display: inline-flex; align-items: center; height: 28px; margin: 0 0 12px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .6); background: rgba(var(--accent-rgb), .14); font-size: 12px; font-weight: 700; color: var(--accent-soft); }
.m-done[hidden] { display: none; }
@media (max-width: 860px) {
  .modal-panel { display: flex; flex-direction: column; }
  .m-head { display: block; padding: calc(30px + env(safe-area-inset-top)) 176px 22px 20px; }
  .m-head small { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid rgba(var(--accent-rgb), .55); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-soft); }
  .m-head h2 { margin: 12px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; }
  .m-head .m-done { margin: 12px 0 0; }
  .m-video { margin: 6px 16px 0; border-radius: 18px; overflow: hidden; flex: none; box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px rgba(var(--accent-rgb), .2); }
  .m-fav { top: calc(24px + env(safe-area-inset-top)); right: 66px; }

  .m-body { padding-top: 8px; }
}
/* aula assistida bem clara no carrossel: selo cheio e check no meio */
.lc.ok .lc-st { background: var(--accent-gradient); border-color: transparent; color: var(--accent-text); }

/* ajustes Jorge Pimenta: tema claro no dourado da marca e botão secundário visível */

</style>

function flowTap(i) { const f = $('#flow'); if (f && f.dataset.drag === '1') return; if (i === flowGo.active) openItem(kM(i)); else flowGo(i); }

function videoOf(v) {
  const s = String(v || '');
  const yt = s.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/) || (/^[\w-]{11}$/.test(s) ? [0, s] : null);
  if (yt) return { embed: `https://www.youtube.com/embed/${yt[1]}?rel=0&autoplay=1`, thumb: `https://i.ytimg.com/vi/${yt[1]}/mqdefault.jpg`, yt: yt[1] };
  const vm = s.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return { embed: `https://player.vimeo.com/video/${vm[1]}?autoplay=1`, thumb: '' };
  return { embed: '', thumb: '' };
}
function lessonCard(key, name, thumb, label) {

}
let swapT;
function openCourse(i, instant) {
  const m = course[i], panel = $('#coursePanel');
  if (!instant && isMob()) { const k = m.lessons.findIndex((_, j) => !isDone(kL(i, j))); document.querySelectorAll('#courseGrid .poster').forEach((p, j) => p.classList.toggle('on', j === i)); openItem(kL(i, k < 0 ? 0 : k)); return; }
  document.querySelectorAll('#courseGrid .poster').forEach((p, k) => p.classList.toggle('on', k === i));
  const html = `
    <div class="panel-head"><b>Módulo ${m.n} · ${esc(m.title)}</b><span>${m.lessons.length} ${m.lessons.length === 1 ? 'vídeo' : 'aulas'}</span></div>
    <div class="lessons">${m.lessons.map(([v, name], k) => lessonCard(kL(i, k), name, videoOf(v).thumb, m.n === 0 ? 'Intro' : 'Aula ' + (k + 1))).join('')}</div>`;

  const from = panel.getBoundingClientRect().height;
