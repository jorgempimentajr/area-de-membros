  window.unlock = ev => { ev.preventDefault(); if ($('#gpass').value === CFG.access.password) { try { localStorage.setItem(authKey, '1'); } catch (e) {} g.remove(); document.body.style.overflow = ''; startFromLink(); } else $('#gerr').textContent = 'Senha incorreta.'; return false; };
} else startFromLink();



/* ═══ PERFIL: foto e nome do aluno (ficam só neste aparelho) ═══ */
function refreshAvatar() {
  const b = $('#avatarBtn'); if (b) { b.innerHTML = avatarInner(); b.classList.toggle('hint', !mem.avatar); }
  const pv = $('#profAv'); if (pv) pv.innerHTML = avatarInner() + `<span class="prof-cam">${ic('camera')}</span>`;
  const rm = $('#profRm'); if (rm) rm.disabled = !mem.avatar;
}
function openProfile() {
  let el = $('#prof');
  if (!el) { el = document.createElement('div'); el.id = 'prof'; el.className = 'sheet prof'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Meu perfil'); el.addEventListener('click', e => { if (e.target === el) closeProfile(); }); document.body.appendChild(el); }
  el.innerHTML = `<div class="sheet-card">
    <div class="prof-top"><button class="prof-av" id="profAv" onclick="document.getElementById('pfile').click()" aria-label="Escolher foto">${avatarInner()}<span class="prof-cam">${ic('camera')}</span></button>
      <div><h3>Seu perfil</h3><p>Toque na foto para escolher da galeria ou tirar uma agora. Ela fica salva só neste aparelho.</p></div></div>
    <label class="prof-lbl">Como você quer ser chamado<input id="pname" type="text" maxlength="24" value="${esc(mem.name || '')}" placeholder="Seu nome" autocomplete="given-name"></label>
    <input id="pfile" type="file" accept="image/*" hidden>
    <div class="sheet-btns"><button class="btn btn-line btn-sm" id="profRm" onclick="removeAvatar()"${mem.avatar ? '' : ' disabled'}>Remover foto</button><button class="btn btn-primary btn-sm" onclick="saveProfile()">Salvar</button></div></div>`;
  el.querySelector('#pfile').onchange = e => pickPhoto(e.target.files[0]);
  requestAnimationFrame(() => el.classList.add('on'));
}
function closeProfile() { const el = $('#prof'); if (el) el.classList.remove('on'); }
async function pickPhoto(f) {
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }), s = Math.min(bmp.width, bmp.height), c = document.createElement('canvas');
    c.width = c.height = 256; c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 256, 256);
    mem.avatar = c.toDataURL('image/jpeg', .85); save(); refreshAvatar(); toast('Foto atualizada');
  } catch (e) { toast('Não consegui abrir essa foto. Tente outra.'); }
}
function removeAvatar() { delete mem.avatar; save(); refreshAvatar(); }
function saveProfile() { mem.name = ($('#pname').value || '').trim(); save(); refreshAvatar(); closeProfile(); toast('Perfil salvo'); }

/* ═══ INSTALAR COMO APP (celular): pergunta uma vez, mostra o passo a passo do sistema da pessoa ═══ */
const UA = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
const inAppBrowser = /FBAN|FBAV|Instagram|WhatsApp|TikTok|Snapchat|Line\/|MicroMessenger|; wv\)/i.test(UA);
const isApp = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstallBtn(); });
addEventListener('appinstalled', () => { mem.inst = { ok: true }; save(); hideSheet(); showInstallBtn(); toast('App instalado'); });
function showInstallBtn() { const b = $('#installBtn'); if (b) b.style.display = (!isApp() && !(mem.inst && mem.inst.ok) && (isIOS || isAndroid || installEvt)) ? '' : 'none'; }
function hideSheet() { $('#sheet').classList.remove('on'); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { if (!(mem.inst && mem.inst.ok)) installLater(); else hideSheet(); } });
function openSheet(html) { $('#sheetCard').innerHTML = html; $('#sheet').classList.add('on'); }
const appIcon = () => `<span class="sheet-ic"><img src="./img/logo-isotipo-dourado.webp" alt="" onerror="this.remove()"></span>`;
function askInstall() {
  openSheet(`<div class="sheet-top">${appIcon()}<div><h3>Transformar em aplicativo?</h3><p>Fique com a sua área de membros na tela inicial do celular, abrindo em tela cheia, como um app.</p></div></div>
    <div class="sheet-btns"><button class="btn btn-line btn-sm" onclick="installLater()">Agora não</button><button class="btn btn-primary btn-sm" onclick="installFlow()">Sim, quero</button></div>`);
}
function shareNow() {
  const d = { title: CFG.site.name, text: 'Minha área de membros', url: location.origin + location.pathname };
  if (navigator.share) navigator.share(d).catch(() => {}); else toast('Use o botão Compartilhar do Safari');
}
function installLater() { mem.inst = { no: Date.now() }; save(); hideSheet(); }
function installDone() { mem.inst = { ok: true }; save(); hideSheet(); showInstallBtn(); }

/* animação de passo a passo (sem som, só movimento): desenhada em código com o ícone e o nome do cliente */
function guideHTML(kind) {
  const icon = './img/logo-isotipo-dourado.webp', nm = esc(CFG.site.short || CFG.site.name), host = esc(location.host);
  const row = (txt, icn, hi) => `<div class="fk-row${hi ? ' hi' : ''}"><span>${txt}</span>${icn ? ic(icn) : ''}${hi ? '<i class="tap"></i>' : ''}</div>`;
  const home = `<div class="fk-home"><b></b><b></b><b></b><b></b><b></b><div class="me"><img src="${icon}" alt=""><span>${nm}</span></div><b></b><b></b><b></b><b></b><b></b><b></b></div>`;
  let scenes = [], caps = [];
  if (kind === 'android') {
    scenes = [
      `<div class="fk-bg"></div><div class="fk-menu">${row('Nova guia', '')}${row('Histórico', '')}${row('Instalar app', 'download', 1)}${row('Configurações', '')}</div>`,
      `<div class="fk-bg"></div><div class="fk-dialog"><img src="${icon}" alt=""><h4>Instalar app?</h4><p>${nm} · ${host}</p><div class="fk-dlgbtns"><span>Cancelar</span><span class="hi">Instalar<i class="tap" style="right:34px"></i></span></div></div>`,
      home];
    caps = ['1. No menu, toque em Instalar app', '2. Toque em Instalar', 'Pronto! O app está na sua tela'];
  } else {
    const first = navigator.share
      ? `<div class="fk-bg"></div><div class="fk-btnui">${ic('share')}Abrir compartilhar<i class="tap"></i></div>`
      : `<div class="fk-bg"></div><div class="fk-menu">${row('Compartilhar', 'share', 1)}${row('Adicionar a Favoritos', 'book')}${row('Adicionar Favorito a…', 'book')}${row('Nova Aba', '')}</div>`;
    scenes = [first,
      `<div class="fk-bg"></div><div class="fk-apps"><b></b><b></b><b></b><b></b></div><div class="fk-list">${row('Copiar', 'file')}${row('Adicionar a Favoritos', 'book')}${row('Buscar na Página', '')}${row('Adicionar à Tela de Início', 'addsq', 1)}${row('Marcação', '')}${row('Imprimir', '')}</div>`,
      `<div class="fk-bg"></div><div class="fk-add"><div class="fk-addtop"><span class="x">×</span><span>Adicionar à Tela de Início</span><span class="go">Adicionar<i class="tap" style="right:6px"></i></span></div><div class="fk-card"><img src="${icon}" alt=""><div><div class="nm">${nm}</div><div class="url">${host}…</div></div></div><div class="fk-tg"><span>Abrir como app web</span><i></i></div></div>`,
      home];
    caps = [navigator.share ? '1. Toque em Abrir compartilhar' : '1. Toque no menu do Safari e em Compartilhar', '2. Role e toque em Adicionar à Tela de Início', '3. Toque em Adicionar', 'Pronto! O app está na sua tela'];
  }
  const n = scenes.length;
  return `<div class="guide" data-n="${n}" aria-label="Animação do passo a passo">${scenes.map((s, i) => `<div class="scn" style="--i:${i}">${s}</div>`).join('')}<div class="gcap">${caps.map((c, i) => `<span style="--i:${i}">${c}</span>`).join('')}</div></div>`;
}
function installFlow() {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(c => { if (c.outcome === 'accepted') installDone(); else hideSheet(); installEvt = null; }); return; }
  const shareBtnOn = isIOS && !inAppBrowser && !!navigator.share;
  const back = `<div class="sheet-btns"><button class="btn btn-line btn-sm" onclick="hideSheet()">Fechar</button><button class="btn ${shareBtnOn ? 'btn-line' : 'btn-primary'} btn-sm" onclick="installDone()">Já adicionei</button></div>`;
  let title = 'Como instalar', steps = '', note = '', shareBtn = '';
  if (inAppBrowser) {
    title = 'Abra no navegador primeiro';
    steps = `<li><span>Toque nos ${ic('dots')} <b>três pontinhos</b> (ou no ícone de compartilhar) aqui em cima.</span></li><li><span>Escolha <b>${isIOS ? 'Abrir no Safari' : 'Abrir no Chrome'}</b>.</span></li><li><span>Quando abrir, toque em <b>Sim, quero</b> de novo.</span></li>`;
    note = 'Dentro do Instagram, WhatsApp e similares não dá pra instalar o app.';
  } else if (isIOS) {
    title = 'Instalar no iPhone';
    steps = `<li><span>Toque no botão <b>Abrir compartilhar</b> logo abaixo.</span></li><li><span>No menu que abrir, role e toque em ${ic('addsq')} <b>Adicionar à Tela de Início</b>.</span></li><li><span>Toque em <b>Adicionar</b>. O ícone aparece na sua tela.</span></li>`;
    shareBtn = navigator.share ? `<button class="btn btn-primary" style="width:100%;height:56px;font-size:16px;margin-top:var(--s3)" onclick="shareNow()">${ic('share')}Abrir compartilhar</button>` : '';
    note = shareBtn ? '' : 'Toque em Compartilhar, na barra do Safari. Precisa estar no Safari.';
  } else if (isAndroid) {
    title = 'Instalar no Android';
    steps = `<li><span>Toque nos ${ic('dots')} <b>três pontinhos</b> do Chrome, no canto da tela.</span></li><li><span>Toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</span></li><li><span>Confirme. O ícone aparece na sua tela.</span></li>`;
  } else {
    title = 'Instalar no computador';
    steps = `<li><span>No Chrome ou Edge, clique no ícone ${ic('download')} de instalar, no fim da barra de endereço.</span></li><li><span>Confirme em <b>Instalar</b>.</span></li>`;
  }
  const anim = !inAppBrowser && (isIOS || isAndroid) ? guideHTML(isIOS ? 'ios' : 'android') : '';
  openSheet(`<div class="sheet-top">${appIcon()}<div><h3>${title}</h3><p>Leva 10 segundos.</p></div></div>${anim}<ol class="sheet-steps">${steps}</ol>${note ? `<div class="sheet-note">${note}</div>` : ''}${shareBtn}${back}`);
}
showInstallBtn();
(function maybeAsk() {
  const recent = mem.inst && (mem.inst.ok || (mem.inst.no && Date.now() - mem.inst.no < 14 * 864e5));
  if (!(isIOS || isAndroid) || isApp() || recent) return;
  const tryShow = () => { if ($('#modal').classList.contains('open') || document.querySelector('.gate')) return setTimeout(tryShow, 8000); askInstall(); };
  setTimeout(tryShow, 9000);                                              // depois que a pessoa já viu a tela, nunca no primeiro desenho
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
document.querySelector('meta[name=apple-mobile-web-app-capable]').insertAdjacentHTML('afterend', `<meta name="apple-mobile-web-app-title" content="${esc(CFG.site.short || CFG.site.name)}">`);

/* ═══ MOVIMENTO: zoom/blur do topo ao rolar, inclinação sutil das capas, imagens que entram suaves ═══ */
function fadeImgs(root = document) {
  root.querySelectorAll('.poster-art img, .lesson-th img, .hero-img, .next-thumb img, .book-img img').forEach(im => {
    im.draggable = false;
    if (im.classList.contains('fadein')) return;
    im.classList.add('fadein');
    const ok = () => im.classList.add('ld');
    im.complete && im.naturalWidth ? requestAnimationFrame(ok) : (im.addEventListener('load', ok), im.addEventListener('error', ok));
  });
}
fadeImgs();
refreshState();
document.querySelectorAll('.rv').forEach(el => io.observe(el));
{
  const hero = $('#inicio'), img = hero.querySelector('.hero-img'), copy = hero.querySelector('.hero-in'), bar = $('#topbar');
  const nativeScroll = CSS.supports('animation-timeline: scroll()');
  let busy = false;
  const frame = () => {
    const y = scrollY, hh = hero.offsetHeight || 1, p = Math.min(1, y / hh);
    bar.classList.toggle('scrolled', y > 8);
    if (!reduceMotion && !nativeScroll && y < hh * 1.2) {
      if (img) img.style.transform = `scale(${1 + p * 0.07})`;
      if (copy) { copy.style.opacity = 1 - p * 1.15; copy.style.filter = `blur(${p * 10}px)`; copy.style.transform = `translate3d(0, ${y * 0.1}px, 0)`; }
    }
    busy = false;
  };
  addEventListener('scroll', () => { if (!busy) { busy = true; requestAnimationFrame(frame); } }, { passive: true });
  frame();
}
if (!reduceMotion) {
  document.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const a = e.target.closest && e.target.closest('.poster-art'); if (!a) return;
    const r = a.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    a.style.setProperty('--rx', ((0.5 - y) * 6).toFixed(2) + 'deg'); a.style.setProperty('--ry', ((x - 0.5) * 8).toFixed(2) + 'deg');
    a.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); a.style.setProperty('--my', (y * 100).toFixed(1) + '%');
  }, { passive: true });
  document.addEventListener('pointerout', e => { const a = e.target.closest && e.target.closest('.poster-art'); if (a) { a.style.removeProperty('--rx'); a.style.removeProperty('--ry'); } });
}

</script>
